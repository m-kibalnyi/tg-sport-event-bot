name: Deploy Bot to Oracle Cloud

on:
  push:
    branches: [cleanup-bot]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 141.144.226.181
          username: ubuntu
          key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
          script: |
            cd ~/tg-sport-event-bot
            git pull origin cleanup-bot
            docker compose up -d --build
            docker image prune -f
